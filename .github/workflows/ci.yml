name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov ruff
          # [notion] pulls in requests, so the Notion code paths are exercised
          # against the dependency they actually import at runtime.
          pip install -e ".[notion]"

      - name: Lint
        run: |
          ruff check .

      # Only on the newest interpreter: current mypy refuses to run under the
      # older ones this project still supports. The annotations themselves are
      # written for the 3.8 floor.
      - name: Type check
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          pip install mypy
          mypy

      - name: Run tests
        run: |
          pytest tests/ -v --cov=claude_diary --cov-report=term-missing

      - name: Check coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        continue-on-error: false
        run: |
          pytest tests/ --cov=claude_diary --cov-fail-under=85
