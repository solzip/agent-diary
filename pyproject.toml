[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-diary"
version = "4.3.1"
description = "Record Claude Code and Codex work sessions as Markdown or Notion work diaries"
readme = "README.en.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "solzip"}]
keywords = ["claude-code", "codex", "productivity", "work-diary", "automation", "hooks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
]
dependencies = []

[project.optional-dependencies]
notion = ["requests>=2.28"]
all = ["requests>=2.28"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.4.0"]

[project.scripts]
# The import package stays `claude_diary`: `python -m claude_diary.hook` is
# written into every user's Claude Code settings.json by `install`, and
# renaming it would stop their Stop Hook silently. Both older command names
# keep working.
agent-diary = "claude_diary.cli:main"
working-diary = "claude_diary.cli:main"
claude-diary = "claude_diary.cli:main"

[project.urls]
Homepage = "https://github.com/solzip/agent-diary"
Repository = "https://github.com/solzip/agent-diary"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py38"
line-length = 120

[tool.ruff.lint]
# Correctness rules only. `UP` is deliberately excluded: this codebase uses
# %-formatting throughout, and rewriting ~460 call sites to f-strings would be
# churn, not a fix.
select = ["E4", "E7", "E9", "E501", "F", "B"]

[tool.ruff.lint.per-file-ignores]
# Re-exported on purpose so submodules resolve them via claude_diary.cli.*
# and tests can patch them there.
"src/claude_diary/cli/__init__.py" = ["F401"]
# Same reason: splitting notion_push into a package kept the import path, so
# every name the old module exposed is re-exported from the package root.
"src/claude_diary/cli/notion_push/__init__.py" = ["F401"]
# Embedded agent contracts: these long lines are shipped text, and wrapping
# them would change what the agent is told.
"src/claude_diary/cli/setup.py" = ["E501"]
# Fixture dicts and sample transcripts read better on one line than wrapped.
"tests/**" = ["E501"]
