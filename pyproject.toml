[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-diary"
version = "4.2.0"
description = "Record Claude Code and Codex work sessions as Markdown or Notion work diaries"
readme = "README.en.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "solzip"}]
keywords = ["claude-code", "codex", "productivity", "work-diary", "automation", "hooks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
]
dependencies = []

[project.optional-dependencies]
notion = ["requests>=2.28"]
all = ["requests>=2.28"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.4.0"]

[project.scripts]
claude-diary = "claude_diary.cli:main"
working-diary = "claude_diary.cli:main"

[project.urls]
Homepage = "https://github.com/solzip/working-diary"
Repository = "https://github.com/solzip/working-diary"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py38"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
