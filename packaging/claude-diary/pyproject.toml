[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# The old distribution name. This project was published as `claude-diary`
# until 4.2.0 and is now `agent-diary`; the name kept receiving installs after
# the rename — 324 of them in the 59 days to 2026-08-12, the most recent three
# days before this was written — and every one of them got 4.2.0, which
# predates the fixes for silent diary-entry loss on concurrent sessions and
# for a partial write erasing a whole day.
#
# This release carries no code. It depends on `agent-diary`, so installing the
# old name now installs the current package, and because the import package is
# `claude_diary` in both, `import claude_diary` keeps working and starts
# resolving to maintained code.
#
# Publish once. It is not meant to track `agent-diary` releases: the dependency
# is a floor, not a pin, so pip resolves the newest.
name = "claude-diary"
version = "5.0.0"
description = "Renamed to agent-diary. Installing this installs agent-diary."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "solzip"}]
keywords = ["claude-code", "agent-diary", "deprecated", "renamed"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = ["agent-diary>=4.8.3"]

[project.optional-dependencies]
# Mirrors of agent-diary's extras, so `pip install "claude-diary[notion]"`
# keeps meaning what it meant.
notion = ["agent-diary[notion]>=4.8.3"]
all = ["agent-diary[all]>=4.8.3"]

[project.urls]
Homepage = "https://github.com/solzip/agent-diary"
Repository = "https://github.com/solzip/agent-diary"
Changelog = "https://github.com/solzip/agent-diary/blob/main/CHANGELOG.md"
Issues = "https://github.com/solzip/agent-diary/issues"

[tool.setuptools]
# No modules. `agent-diary` ships the `claude_diary` import package, and
# shipping a second copy from here would put two distributions in a fight over
# the same files.
packages = []
